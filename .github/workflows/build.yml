name: Build Windows packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore .\CodexQuotaBar.slnx
          dotnet build .\CodexQuotaBar.slnx -c Release --no-restore

      - name: Create lite package
        shell: pwsh
        run: |
          dotnet publish .\CodexQuotaBar\CodexQuotaBar.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\lite
          Copy-Item .\scripts\Install.ps1 .\artifacts\lite\Install.ps1
          Compress-Archive -Path .\artifacts\lite\* -DestinationPath .\artifacts\CodexQuotaBar-lite-win-x64.zip

      - name: Create standalone package
        shell: pwsh
        run: |
          dotnet publish .\CodexQuotaBar\CodexQuotaBar.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\standalone
          Copy-Item .\scripts\Install.ps1 .\artifacts\standalone\Install.ps1
          Compress-Archive -Path .\artifacts\standalone\* -DestinationPath .\artifacts\CodexQuotaBar-standalone-win-x64.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuotaBar-Windows
          path: artifacts/*.zip

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\artifacts\*.zip --generate-notes --title $env:GITHUB_REF_NAME
